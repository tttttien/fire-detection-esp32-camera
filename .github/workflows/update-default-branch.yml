name: Auto update default branch
on:
  push:
    branches:
      - 'v*'  # Đơn giản hơn, match mọi branch v*

jobs:
  update-default-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: write
      metadata: read
    
    steps:
      - name: Update default branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "Updating default branch to: $BRANCH_NAME"
          gh api repos/${{ github.repository }} \
            --method PATCH \
            --field default_branch="$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
